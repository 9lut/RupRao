# Overrides for a single cloud VM (GCP e2-standard-4: 4 vCPU, 16 GB; see docs/deploy-gcp.md).
#   docker compose -f docker-compose.yml -f docker-compose.gcp.yml up -d --build
name: ai-photo-finder

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }  # keep the 30 GB disk from filling with logs

services:
  caddy:
    <<: *logging
  web:
    <<: *logging
    mem_limit: 256m
  api:
    <<: *logging
    mem_limit: 2500m
    environment:
      MODEL_DIR: /app/models
      API_ROOT_PATH: /api
      API_DOCS: "false"  # no public map of the API
      OMP_NUM_THREADS: "2"  # 2 threads per inference; the 2 workers take the other 2 vCPUs
      FACE_CONCURRENCY: "1"  # the rest wait in the scan queue
  worker:
    <<: *logging
    mem_limit: 2000m
    cpu_shares: 512  # under contention the site (api) wins over scanning, but scanning isn't starved
    deploy:
      replicas: 2  # one photo per worker at a time; each uses OMP_NUM_THREADS vCPUs
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/models
      OMP_NUM_THREADS: "2"
  postgres:
    <<: *logging
    mem_limit: 384m
    # Not reachable from the internet anyway (127.0.0.1); drop the host port on the VM.
    ports: !reset []
  redis:
    <<: *logging
    mem_limit: 128m
    command: redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction
  minio:
    <<: *logging
    mem_limit: 512m
    environment:
      # MinIO sizes this from its memory limit, and at 384 MB it answered 429 to some thumbnails
      # with 500 people on the site.
      MINIO_API_REQUESTS_MAX: "300"
    ports: !reset []
